services:
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      # `next build` reads these to generate the rewrites, so they have to reach
      # the image at build time — the runtime `environment:` block below comes
      # too late and the Dockerfile's ARG defaults get baked into
      # routes-manifest.json instead (see #189).
      args:
        - BACKEND_URL=http://devfest-${ENV_NAME:-local}-backend:4000
        - BASE_URL=${BASE_URL}
    environment:
      - BASE_URL=${BASE_URL}
      # Pinned to the env-scoped backend container name. Resolving the bare
      # `backend` hostname picks up other Coolify projects' backends via the
      # shared `coolify` network (IPv6 priority), causing cross-env requests.
      - BACKEND_URL=http://devfest-${ENV_NAME:-local}-backend:4000
      # Shared with the backend to authorise POST /api/revalidate. Without it
      # the admin's saves never purged anything here: every change waited for
      # the hour-long s-maxage, and a status switch looked broken.
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      # Sent by the frontend server on its calls to the backend, which then exempts them from the rate limit (#689). Same value on both services; unset = no exemption.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
    expose:
      - "3000"
    depends_on:
      - backend
    # Persist Next.js' on-the-fly image optimization cache across rebuilds.
    # Without this, every redeploy throws away all the AVIF/WebP variants
    # that next/image generated and the first visitor pays the CPU cost
    # again for each image.
    volumes:
      - next_image_cache:/app/.next/cache/images
    networks:
      - default
      - coolify

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args:
        - SEED_SCRIPT=prisma/seed-dev.ts
        # Coolify sets SOURCE_COMMIT to the deployed commit; empty elsewhere.
        - APP_COMMIT=${SOURCE_COMMIT:-}
    volumes:
      - uploads:/app/uploads
    environment:
      - BASE_URL=${BASE_URL}
      - FRONTEND_URL=http://frontend:3000
      - PORT=4000
      # Proxies between the visitor and this backend (#663): Traefik, then the
      # Next.js frontend, whose container is the socket peer. Traefik writes
      # X-Forwarded-For and Next passes it on; the backend counts one hop back
      # from the socket for `request.ip` (rate limits, history). Set it to the
      # real chain: too low merges visitors into one bucket, too high lets them
      # pick their address. Unset = 0 = trust nobody.
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      # Shared with the frontend to sign POST /api/revalidate (see frontend).
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      # See the frontend service (#689): requests carrying it are not rate-limited.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-devfest}:${POSTGRES_PASSWORD:-devfest}@db:5432/${POSTGRES_DB:-devfest}
      # No default: a public one would sign dev-j's sessions (#658). The
      # backend refuses to start without it once it is told it runs deployed
      # (NODE_ENV=production, or an ENV_NAME other than "local").
      - SESSION_SECRET=${SESSION_SECRET:-}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@devfesttoulouse.fr,editor@devfesttoulouse.fr}
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_FROM=${SMTP_FROM:-contact@devfesttoulouse.fr}
      - BILLETWEB_USER=${BILLETWEB_USER:-}
      - BILLETWEB_KEY=${BILLETWEB_KEY:-}
      - SPONSOR_GUESTS_ENABLED=${SPONSOR_GUESTS_ENABLED:-}
      # Scheduled trash purge (#149). Unset means the endpoint only accepts an
      # ADMIN session — the purge stops running, nothing opens up.
      - TRASH_PURGE_SECRET=${TRASH_PURGE_SECRET:-}
      - TRASH_RETENTION_DAYS=${TRASH_RETENTION_DAYS:-}
      # seed-dev.ts gives its demo accounts DEV_SEED_PASSWORD here: the
      # documented ones are public. A named environment without it makes the
      # seed fail, and db-boot.sh stops the backend (#658). Unset ENV_NAME falls
      # back on "dev", not "local", so it never reopens the documented ones.
      - ENV_NAME=${ENV_NAME:-dev}
      - DEV_SEED_PASSWORD=${DEV_SEED_PASSWORD:-}
      # A new value empties the database once at the next start, to switch the
      # environment to another branch (#714). Declared here only: beta and
      # prod never receive it. Empty = keep the data.
      - DB_RESET_TOKEN=${DB_RESET_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    # Intentionally NOT on the shared `coolify` network. The backend isn't
    # exposed via Traefik — the frontend proxies /api/* to it through the
    # Next.js rewrites. Joining `coolify` would put it side-by-side with the
    # backend of every other Coolify project that uses the same service name,
    # and Docker DNS would round-robin between them.
    #
    # Network alias gives the backend a unique, env-scoped hostname inside
    # the project's `default` network. The frontend points BACKEND_URL at
    # this alias instead of the bare `backend` to avoid resolving against
    # other projects' backends through the shared `coolify` network (Coolify
    # ignores `container_name` so we can't rely on that).
    networks:
      default:
        aliases:
          - devfest-${ENV_NAME:-local}-backend

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-devfest}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devfest}
      - POSTGRES_DB=${POSTGRES_DB:-devfest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The backend waits for this check (`service_healthy`): `start_interval`
    # keeps that wait short despite the 30s `interval` (#704).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devfest}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: devfest-${ENV_NAME:-local}-mailhog
    # Its UI and API are public behind Traefik and hold every e-mail the
    # environment sends, sign-in links included: HTTP auth is mandatory here
    # (#658). MailHog wants a `user:bcrypt` file; it is written at start from
    # two plain variables, hashed by MailHog itself, so no `$` of a bcrypt
    # hash has to survive Coolify's variable handling. SMTP stays open to the
    # backend. The local compose keeps MailHog without auth.
    environment:
      - MAILHOG_USER=${MAILHOG_USER:-}
      - MAILHOG_PASSWORD=${MAILHOG_PASSWORD:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$MAILHOG_USER" ] || [ -z "$$MAILHOG_PASSWORD" ]; then
          echo "MAILHOG_USER and MAILHOG_PASSWORD are required: MailHog will not start unprotected." >&2
          exit 1
        fi
        printf '%s:%s\n' "$$MAILHOG_USER" "$$(MailHog bcrypt "$$MAILHOG_PASSWORD")" > /tmp/mailhog-auth
        exec MailHog -auth-file=/tmp/mailhog-auth
    expose:
      - "8025"
    networks:
      - default
      - coolify

networks:
  coolify:
    external: true

volumes:
  pgdata:
  uploads:
  next_image_cache:
