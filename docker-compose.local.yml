services:
  frontend:
    container_name: devfest-local-frontend
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
      # Keep the build cache off the Windows bind mount: Turbopack rewrites its
      # route manifest constantly, and a restart mid-write leaves it truncated —
      # Next then compiles /_not-found instead of /[locale] and serves 404 on
      # every page until .next is wiped. A named volume is native Linux fs.
      - frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - BACKEND_URL=http://backend:4000
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      # Unset by default: no analytics in local dev. Set it to exercise
      # Plausible and the Core Web Vitals reporting (#118).
      - NEXT_PUBLIC_PLAUSIBLE_SRC=${NEXT_PUBLIC_PLAUSIBLE_SRC:-}
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --config.confirmModulesPurge=false && pnpm dev"
    depends_on:
      - backend

  backend:
    container_name: devfest-local-backend
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src/backend:/app
      - backend_node_modules:/app/node_modules
      - ./uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - NODE_ENV=development
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - FRONTEND_URL=http://frontend:3000
      - PORT=4000
      # Normally injected at build time from the deployed commit (#290). Set it
      # locally to exercise the badge; empty means "not a deployed build".
      - APP_COMMIT=${APP_COMMIT:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-devfest}:${POSTGRES_PASSWORD:-devfest}@db:5432/${POSTGRES_DB:-devfest}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-session-secret-min-32-chars}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@devfesttoulouse.fr,editor@devfesttoulouse.fr}
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_FROM=${SMTP_FROM:-contact@devfesttoulouse.fr}
      - BILLETWEB_USER=${BILLETWEB_USER:-}
      - BILLETWEB_KEY=${BILLETWEB_KEY:-}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      - BROCHURE_TOKEN_SECRET=${BROCHURE_TOKEN_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    command: >
      sh -c "
        corepack enable &&
        corepack prepare pnpm@9.15.4 --activate &&
        pnpm install --config.confirmModulesPurge=false &&
        pnpm exec prisma generate &&
        pnpm dev
      "
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  db:
    container_name: devfest-local-db
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-devfest}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devfest}
      - POSTGRES_DB=${POSTGRES_DB:-devfest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devfest}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    container_name: devfest-local-mailhog
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  frontend_node_modules:
  frontend_next:
  backend_node_modules:
  pgdata:
