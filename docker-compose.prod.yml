services:
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      # `next build` reads these to generate the rewrites, the CSP and the
      # NEXT_PUBLIC_* bundle, so they have to reach the image at build time —
      # the runtime `environment:` block below comes too late. Without them the
      # Dockerfile's ARG defaults get baked into routes-manifest.json, pinning
      # the rewrites to the bare `backend` hostname (see #189).
      args:
        - BACKEND_URL=http://devfest-${ENV_NAME:-local}-backend:4000
        - BASE_URL=${BASE_URL}
        - NEXT_PUBLIC_PLAUSIBLE_SRC=${NEXT_PUBLIC_PLAUSIBLE_SRC:-}
    environment:
      - NODE_ENV=production
      - BASE_URL=${BASE_URL}
      # Pinned to the env-scoped backend container name. Resolving the bare
      # `backend` hostname picks up other Coolify projects' backends via the
      # shared `coolify` network (IPv6 priority), causing cross-env requests.
      - BACKEND_URL=http://devfest-${ENV_NAME:-local}-backend:4000
      # Shared with the backend to authorise POST /api/revalidate (on-demand
      # cache invalidation when the admin edits content). If unset, revalidation
      # is disabled and public pages stay cached until the s-maxage TTL.
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      # Plausible analytics script URL. If unset, analytics stays off.
      - NEXT_PUBLIC_PLAUSIBLE_SRC=${NEXT_PUBLIC_PLAUSIBLE_SRC:-}
    expose:
      - "3000"
    depends_on:
      - backend
    # Persist Next.js' on-the-fly image optimization cache across rebuilds.
    # Without this, every redeploy throws away all the AVIF/WebP variants
    # that next/image generated and the first visitor pays the CPU cost
    # again for each image.
    volumes:
      - next_image_cache:/app/.next/cache/images
    networks:
      - default
      - coolify

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args:
        - SEED_SCRIPT=prisma/seed.ts
    volumes:
      - uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - BASE_URL=${BASE_URL}
      - FRONTEND_URL=http://frontend:3000
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SESSION_SECRET=${SESSION_SECRET}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET:-}
      # Shared with the frontend to sign POST /api/revalidate (see frontend).
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      # HMAC secret to sign per-message brochure download links sent by email.
      # If unset, confirmation emails fall back to the raw URL (no tracking).
      - BROCHURE_TOKEN_SECRET=${BROCHURE_TOKEN_SECRET:-}
      # Google Gemini key for the back-office FR<->EN translator. If unset,
      # POST /api/admin/translate returns 503 and the UI button is disabled.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      # SMTP relayed through the standalone `postfix` service deployed at
      # the Coolify level (shared by all projects). Reachable via the
      # `coolify` network — see the `networks:` section below.
      - SMTP_HOST=${SMTP_HOST:-postfix}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_AUTH=${SMTP_AUTH:-false}
      - SMTP_FROM=${SMTP_FROM:-contact@devfesttoulouse.fr}
      - BILLETWEB_USER=${BILLETWEB_USER:-}
      - BILLETWEB_KEY=${BILLETWEB_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    # The backend itself is NOT exposed via Traefik (the frontend proxies
    # /api/* to it through the Next.js rewrites). It joins the shared
    # `coolify` network only to reach the standalone `postfix` service
    # deployed at the Coolify level.
    #
    # The env-scoped alias must sit on `coolify`, not on `default`: `default` is
    # private to this stack, so an alias there protects nothing. On the shared
    # network the service would otherwise answer to the bare `backend` name and
    # collide with every other project's backend (see
    # docs/coolify-pieges-multi-environnements.md).
    #
    # Both networks are declared as mappings with content. A bare `coolify:`
    # key serialises to `coolify: null`, and Compose then silently skips the
    # attachment — the container comes up without the shared network and
    # `postfix` stops resolving, breaking every outgoing email.
    networks:
      default:
        aliases:
          - devfest-${ENV_NAME:-local}-backend
      coolify:
        aliases:
          - devfest-${ENV_NAME:-local}-backend

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  coolify:
    external: true

volumes:
  pgdata:
  uploads:
  next_image_cache:
