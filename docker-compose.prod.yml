services:
  frontend:
    container_name: devfest-${ENV_NAME:-prod}-frontend
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    environment:
      - BASE_URL=${BASE_URL}
      - BACKEND_URL=http://backend:4000
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - default
      - coolify

  backend:
    container_name: devfest-${ENV_NAME:-prod}-backend
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args:
        - SEED_SCRIPT=prisma/seed.ts
    volumes:
      - uploads:/app/uploads
    environment:
      - BASE_URL=${BASE_URL}
      - FRONTEND_URL=http://frontend:3000
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SESSION_SECRET=${SESSION_SECRET}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET:-}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - SMTP_HOST=postfix
      - SMTP_PORT=25
      - SMTP_FROM=${SMTP_FROM:-contact@devfesttoulouse.fr}
      - BILLETWEB_USER=${BILLETWEB_USER:-}
      - BILLETWEB_KEY=${BILLETWEB_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      postfix:
        condition: service_started
    networks:
      - default
      - coolify

  db:
    container_name: devfest-${ENV_NAME:-prod}-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postfix:
    container_name: devfest-${ENV_NAME:-prod}-postfix
    image: boky/postfix:latest
    environment:
      - ALLOWED_SENDER_DOMAINS=${SMTP_DOMAIN:-devfesttoulouse.fr}
    networks:
      - default

networks:
  coolify:
    external: true

volumes:
  pgdata:
  uploads:
