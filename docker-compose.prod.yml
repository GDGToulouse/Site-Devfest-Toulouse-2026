services:
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    environment:
      - BASE_URL=${BASE_URL}
      # Pinned to the env-scoped backend container name. Resolving the bare
      # `backend` hostname picks up other Coolify projects' backends via the
      # shared `coolify` network (IPv6 priority), causing cross-env requests.
      - BACKEND_URL=http://devfest-${ENV_NAME:-local}-backend:4000
    expose:
      - "3000"
    depends_on:
      - backend
    # Persist Next.js' on-the-fly image optimization cache across rebuilds.
    # Without this, every redeploy throws away all the AVIF/WebP variants
    # that next/image generated and the first visitor pays the CPU cost
    # again for each image.
    volumes:
      - next_image_cache:/app/.next/cache/images
    networks:
      - default
      - coolify

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args:
        - SEED_SCRIPT=prisma/seed.ts
    volumes:
      - uploads:/app/uploads
    environment:
      - BASE_URL=${BASE_URL}
      - FRONTEND_URL=http://frontend:3000
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SESSION_SECRET=${SESSION_SECRET}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET:-}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      # SMTP relayed through the standalone `postfix` service deployed at
      # the Coolify level (shared by all projects). Reachable via the
      # `coolify` network — see the `networks:` section below.
      - SMTP_HOST=${SMTP_HOST:-postfix}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_AUTH=${SMTP_AUTH:-false}
      - SMTP_FROM=${SMTP_FROM:-contact@devfesttoulouse.fr}
      - BILLETWEB_USER=${BILLETWEB_USER:-}
      - BILLETWEB_KEY=${BILLETWEB_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    # The backend itself is NOT exposed via Traefik (the frontend proxies
    # /api/* to it through the Next.js rewrites). It joins the shared
    # `coolify` network only to reach the standalone `postfix` service
    # deployed at the Coolify level. Inbound resolution from other projects
    # is mitigated by the env-scoped network alias on `default` —
    # `BACKEND_URL` points at that alias, never at the bare `backend` name.
    networks:
      default:
        aliases:
          - devfest-${ENV_NAME:-local}-backend
      coolify:

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  coolify:
    external: true

volumes:
  pgdata:
  uploads:
  next_image_cache:
